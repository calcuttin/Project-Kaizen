server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  include /etc/nginx/security-headers.conf;

  location /assets/ { include /etc/nginx/security-headers.conf; try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / { include /etc/nginx/security-headers.conf; try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
