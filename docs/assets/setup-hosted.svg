<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">Managed Kaizen cloud setup</title><desc id="desc">A four step flow from source code to Vercel and Supabase.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#111a31"/><stop offset="1" stop-color="#172b45"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#5f78ff"/><stop offset="1" stop-color="#53d8c4"/></linearGradient></defs>
  <rect width="1440" height="560" rx="34" fill="url(#bg)"/><text x="72" y="86" fill="#fff" font-family="Georgia,serif" font-size="46">Managed cloud: no Docker required</text><text x="72" y="124" fill="#b6c4dc" font-family="Inter,Arial" font-size="20">Supabase owns the backend. Vercel serves the web app. Your browser keeps an offline copy.</text>
  <path d="M310 297H407M650 297H747M990 297H1087" stroke="#6f83b5" stroke-width="4" stroke-linecap="round"/><path d="m397 287 16 10-16 10m233-20 16 10-16 10m233-20 16 10-16 10" stroke="#6f83b5" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Inter,Arial"><g transform="translate(72 190)"><circle cx="94" cy="107" r="76" fill="#263b67"/><text x="94" y="101" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">1</text><path d="M58 122h72M68 110h52M77 98h34" stroke="#88a4ff" stroke-width="8" stroke-linecap="round"/><text x="94" y="218" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Create Supabase</text><text x="94" y="248" text-anchor="middle" fill="#b6c4dc" font-size="16">project + Auth</text></g>
  <g transform="translate(412 190)"><circle cx="94" cy="107" r="76" fill="#244d59"/><text x="94" y="101" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">2</text><path d="M66 77h56v60H66z" fill="none" stroke="#62d9c6" stroke-width="7"/><path d="M78 95h32M78 111h22" stroke="#62d9c6" stroke-width="6" stroke-linecap="round"/><text x="94" y="218" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Push schema</text><text x="94" y="248" text-anchor="middle" fill="#b6c4dc" font-size="16">migrations + function</text></g>
  <g transform="translate(752 190)"><circle cx="94" cy="107" r="76" fill="#403064"/><text x="94" y="101" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">3</text><path d="M61 123c10-31 24-38 38-25 8-25 45-18 45 10 16-4 28 9 28 23 0 15-13 25-29 25H77c-17 0-26-15-16-33Z" fill="#b699ff"/><text x="94" y="218" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Deploy Vercel</text><text x="94" y="248" text-anchor="middle" fill="#b6c4dc" font-size="16">builds the static app</text></g>
  <g transform="translate(1092 190)"><circle cx="94" cy="107" r="76" fill="#28445d"/><text x="94" y="101" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">4</text><rect x="54" y="72" width="80" height="58" rx="7" fill="none" stroke="#81d7ff" stroke-width="7"/><path d="M76 148h36" stroke="#81d7ff" stroke-width="7" stroke-linecap="round"/><text x="94" y="218" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Open Kaizen</text><text x="94" y="248" text-anchor="middle" fill="#b6c4dc" font-size="16">sign in, then sync</text></g></g>
  <rect x="72" y="485" width="1296" height="2" fill="url(#accent)" opacity=".75"/><text x="72" y="529" fill="#9ec4d5" font-family="Inter,Arial" font-size="17">Vercel only needs public VITE_ values. Keep service-role keys inside Supabase Edge Functions.</text>
</svg>
