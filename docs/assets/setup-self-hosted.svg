<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">Self-hosted Kaizen paths</title><desc id="desc">A visual showing a simple device-only container and a full self-hosted cloud stack.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#1d172f"/><stop offset="1" stop-color="#312047"/></linearGradient></defs>
  <rect width="1440" height="560" rx="34" fill="url(#bg)"/><text x="72" y="86" fill="#fff" font-family="Georgia,serif" font-size="46">Self-hosted: choose the amount you operate</text><text x="72" y="124" fill="#d7c4e6" font-family="Inter,Arial" font-size="20">Device-only is one small container. Full cloud sync means operating the Supabase services too.</text>
  <g transform="translate(72 180)"><rect width="572" height="284" rx="24" fill="#29213e" stroke="#a86eff" stroke-opacity=".65"/><text x="34" y="54" fill="#fff" font-family="Inter,Arial" font-size="25" font-weight="700">A. Private device-only server</text><text x="34" y="86" fill="#d8c8e8" font-family="Inter,Arial" font-size="17">Simple: no account, no database server, no Dockerized Supabase.</text><rect x="38" y="122" width="152" height="92" rx="12" fill="#3b2c57"/><rect x="67" y="144" width="94" height="48" rx="5" fill="#b78aff"/><path d="M92 207h44" stroke="#b78aff" stroke-width="7" stroke-linecap="round"/><path d="M208 168h120" stroke="#b78aff" stroke-width="4" stroke-linecap="round"/><path d="m318 158 15 10-15 10" fill="none" stroke="#b78aff" stroke-width="4"/><rect x="350" y="124" width="165" height="88" rx="14" fill="#44335f"/><text x="432" y="164" text-anchor="middle" fill="#fff" font-family="Inter,Arial" font-size="17" font-weight="700">Kaizen container</text><text x="432" y="191" text-anchor="middle" fill="#d8c8e8" font-family="Inter,Arial" font-size="14">IndexedDB in browser</text><text x="34" y="256" fill="#fff" font-family="Inter,Arial" font-size="17">Run: docker compose up --build</text></g>
  <g transform="translate(796 180)"><rect width="572" height="284" rx="24" fill="#29213e" stroke="#e98cff" stroke-opacity=".65"/><text x="34" y="54" fill="#fff" font-family="Inter,Arial" font-size="25" font-weight="700">B. Full private cloud</text><text x="34" y="86" fill="#d8c8e8" font-family="Inter,Arial" font-size="17">More control: you maintain updates, backups, mail, and monitoring.</text><g transform="translate(38 122)"><rect width="118" height="92" rx="12" fill="#44335f"/><text x="59" y="159" fill="#fff" font-family="Inter,Arial" font-size="15" font-weight="700">Kaizen</text><text x="59" y="181" fill="#d8c8e8" font-family="Inter,Arial" font-size="13">web app</text><path d="M132 46h58" stroke="#e99aff" stroke-width="4"/><path d="m180 36 15 10-15 10" fill="none" stroke="#e99aff" stroke-width="4"/><rect x="210" width="230" height="136" rx="16" fill="#38294f"/><text x="325" y="35" text-anchor="middle" fill="#fff" font-family="Inter,Arial" font-size="17" font-weight="700">Supabase Docker stack</text><text x="325" y="68" text-anchor="middle" fill="#d8c8e8" font-family="Inter,Arial" font-size="14">Auth · Postgres · Storage</text><text x="325" y="93" text-anchor="middle" fill="#d8c8e8" font-family="Inter,Arial" font-size="14">REST · Edge Functions</text></g><text x="34" y="256" fill="#fff" font-family="Inter,Arial" font-size="17">Use the official Supabase Docker guide, then apply this repo’s migrations.</text></g>
  <text x="72" y="524" fill="#c0a4d8" font-family="Inter,Arial" font-size="17">If you do not specifically need to operate infrastructure, choose managed cloud instead.</text>
</svg>
