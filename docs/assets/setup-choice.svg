<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Choose a Kaizen setup path</title><desc id="desc">A visual comparison between managed cloud hosting and self hosting.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#101728"/><stop offset="1" stop-color="#25173b"/></linearGradient><linearGradient id="cloud" x1="0" x2="1"><stop stop-color="#6f7cff"/><stop offset="1" stop-color="#a85cff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-opacity=".28"/></filter></defs>
  <rect width="1440" height="720" rx="38" fill="url(#bg)"/><circle cx="720" cy="-80" r="390" fill="#6677ff" opacity=".11"/><circle cx="1360" cy="690" r="310" fill="#e66cff" opacity=".12"/>
  <text x="92" y="112" fill="#dfe5ff" font-family="Inter,Arial,sans-serif" font-size="24" letter-spacing="4">KAIZEN SETUP</text><text x="92" y="178" fill="white" font-family="Georgia,serif" font-size="58">Pick the home that fits your day.</text><text x="92" y="220" fill="#b7c0df" font-family="Inter,Arial,sans-serif" font-size="22">Both paths run the same Kaizen app. The difference is who runs the backend.</text>
  <g filter="url(#shadow)"><rect x="92" y="286" width="584" height="338" rx="26" fill="#17203a" stroke="#7787ff" stroke-opacity=".65"/><rect x="764" y="286" width="584" height="338" rx="26" fill="#1d1930" stroke="#d477ff" stroke-opacity=".65"/></g>
  <g transform="translate(132 332)"><circle cx="42" cy="42" r="42" fill="url(#cloud)"/><path d="M22 52c7-19 15-25 25-18 5-17 31-12 31 6 10-2 18 5 18 14 0 10-9 16-20 16H30c-11 0-16-9-8-18Z" fill="white" opacity=".95"/><text x="104" y="28" fill="#fff" font-family="Inter,Arial" font-size="30" font-weight="700">Hosted cloud</text><text x="104" y="60" fill="#b9c4e7" font-family="Inter,Arial" font-size="18">Supabase + Vercel run the infrastructure</text><text x="0" y="132" fill="#eef1ff" font-family="Inter,Arial" font-size="20">Best when you want:</text><text x="0" y="172" fill="#b9c4e7" font-family="Inter,Arial" font-size="18">• sign-in and sync across devices</text><text x="0" y="204" fill="#b9c4e7" font-family="Inter,Arial" font-size="18">• no servers or Docker to operate</text><text x="0" y="236" fill="#b9c4e7" font-family="Inter,Arial" font-size="18">• a link you can share or use anywhere</text></g>
  <g transform="translate(804 332)"><circle cx="42" cy="42" r="42" fill="#8f5ad7"/><rect x="20" y="19" width="44" height="46" rx="5" fill="white"/><path d="M28 30h28M28 41h28M28 52h15" stroke="#8f5ad7" stroke-width="4" stroke-linecap="round"/><text x="104" y="28" fill="#fff" font-family="Inter,Arial" font-size="30" font-weight="700">Self-hosted</text><text x="104" y="60" fill="#d8bee9" font-family="Inter,Arial" font-size="18">You run Kaizen and, if needed, Supabase</text><text x="0" y="132" fill="#f7edff" font-family="Inter,Arial" font-size="20">Best when you want:</text><text x="0" y="172" fill="#d8bee9" font-family="Inter,Arial" font-size="18">• a private device-only install</text><text x="0" y="204" fill="#d8bee9" font-family="Inter,Arial" font-size="18">• control of servers, data, and updates</text><text x="0" y="236" fill="#d8bee9" font-family="Inter,Arial" font-size="18">• to operate your own sync backend</text></g>
  <text x="92" y="678" fill="#9aa6cf" font-family="Inter,Arial" font-size="17">Start hosted for convenience. Start device-only for the simplest private setup. You can add cloud sync later.</text>
</svg>
